<!DOCTYPE html>
<html>
  <head>
    <title>Unit Converter</title>
    <link rel="stylesheet" href="./us.css">
  </head>
    <body>
      <div id="headdiv">
          <h1>Unit Converter</h1>
            <input id="input-el" type="number">
            <button id="btn-el">Convert</button>
      </div>
      <div id="maindiv">
          <div class="divy">
            <h3>Length (Kilometre/Mile)</h3>
            <p id="length-p"></p>
          </div>
          <div class="divy">
            <h3>Volume (Litres/Gallons)</h3>
            <p id="volume-p"></p>
          </div>
          <div class="divy">
              <h3>Mass (Kilograms/Pounds)</h3>
              <p id="mass-p"></p>
          </div>
          <div class="divy">
              <h3>Temperature (Celsius/Fahrenheit)</h3>
              <p id="temp-p"></p>
          </div>
      </div>


      <script src="./uc.js"></script>
    </body>
</html>
